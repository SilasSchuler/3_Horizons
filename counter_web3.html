<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.2.6/dist/web3.min.js"></script>

  <script>
    let web3;
    let contract;
    let userAccount;

    const abi = [
	{
		"inputs": [],
		"name": "decrement",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "increment",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "getCounter",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
    ];

    const contractAddress = '0xCA60cF7E49d7dC181E97F901987BE9179f16457F';

    // Initialize Web3 and request account access
    window.addEventListener('load', async () => {
      if (window.ethereum) {
        web3 = new Web3(window.ethereum);
        try {
          // Request account access
          const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
          userAccount = accounts[0];
          console.log('Connected account:', userAccount);

          // Create contract instance
          contract = new web3.eth.Contract(abi, contractAddress);
        } catch (error) {
          console.error('User denied account access', error);
        }
      } else {
        alert('MetaMask not detected. Please install MetaMask.');
      }
    });

    async function increment() {
      if (!userAccount) {
        alert('Please connect MetaMask.');
        return;
      }
      try {
        const tx = await contract.methods.increment().send({ from: userAccount });
        console.log('Transaction:', tx);
      } catch (error) {
        console.error(error);
      }
    }

    async function decrement() {
      if (!userAccount) {
        alert('Please connect MetaMask.');
        return;
      }
      try {
        const tx = await contract.methods.decrement().send({ from: userAccount });
        console.log('Transaction:', tx);
      } catch (error) {
        console.error(error);
      }
    }

    async function getCount() {
      if (!contract) {
        alert('Contract not initialized.');
        return;
      }
      try {
        const counter = await contract.methods.getCounter().call();
        document.getElementById('counter').innerHTML = counter;
      } catch (error) {
        console.error(error);
      }
    }
  </script>
</head>
<body>
  <!-- Buttons -->
  <button onclick="increment()">Add</button><br>
  <button onclick="decrement()">Subtract</button><br><br>
  <button onclick="getCount()">Get Counter</button><br>
  <div id="counter"></div>
</body>
</html>
